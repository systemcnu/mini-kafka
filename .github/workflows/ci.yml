# CI battery (D-SL0-9). Every command here also runs locally via
# scripts/checks.sh; runner images are mutable, so jobs echo the resolved
# image rather than claiming immutability (DD-26).
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: echo "runner image= $ImageOS $ImageVersion"
      - run: go test ./... -count=1

  vet-staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: echo "runner image= $ImageOS $ImageVersion"
      - run: go vet ./...
      # staticcheck pinned to a release compatible with the pinned toolchain.
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck ./...

  stdlib-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: echo "runner image= $ImageOS $ImageVersion"
      - run: bash scripts/stdlib_audit.sh

  # PROT-1's registry diff as a visibly named check (DD-26's "PROTOCOL.md
  # registry diff" job): docs/PROTOCOL.md's tables ≡ internal/wire, both
  # directions. The test also rides the test job's go test ./... — the
  # named job is the readable signal, not the only run.
  protocol-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: echo "runner image= $ImageOS $ImageVersion"
      - run: go test ./internal/wire -run TestProtocolDoc -count=1

  # DD-21's external clock (D-SL3-5): fresh checkout in a container pinned
  # BY DIGEST — the digest is a fact of this committed workflow and the
  # receipt echoes it verbatim (satisfying DD-21's "resolved image digest"
  # via workflow pinning, not in-container observation — G-SL3-1).
  # Digest obtained at authoring time (2026-07-29) on a logged-in dev
  # machine via `docker manifest inspect golang:1.24` +
  # `docker buildx imagetools inspect golang:1.24`: this is the tag's
  # manifest-list (OCI index) digest, which resolves linux/amd64
  # sha256:46fdd02b6cbcd624a4087ea298e4c8505e5d400c4ee5181e4dd06e2297d647ae
  # at pull. Refreshing the pin is a deliberate manual act (G-SL3-1).
  demo-timing:
    runs-on: ubuntu-latest
    container: golang:1.24@sha256:d2d2bc1c84f7e60d7d2438a3836ae7d0c847f4888464e7ec9ba3a1339a1ee804
    steps:
      - uses: actions/checkout@v4
      - name: demo timing gate (first-flow <= 60s, total <= 180s)
        shell: bash
        env:
          DEMO_TIMING_IMAGE_REF: golang:1.24@sha256:d2d2bc1c84f7e60d7d2438a3836ae7d0c847f4888464e7ec9ba3a1339a1ee804
        run: |
          cat /etc/os-release
          bash scripts/demo_timing.sh 2>&1 | tee demo-timing-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-timing-receipt
          path: demo-timing-receipt.txt

  build-smoke:
    # OPS-1: native build + smoke on BOTH platforms (ledger row 6).
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: echo "runner image= $ImageOS $ImageVersion"
      - name: build broker and CLI
        run: |
          CGO_ENABLED=0 go build -o bin/minikafka ./cmd/minikafka
          CGO_ENABLED=0 go build -o bin/mk ./cmd/mk
      - name: 5s produce/consume smoke
        run: |
          set -euo pipefail
          ./bin/minikafka --data "$RUNNER_TEMP/smoke-data" &
          BROKER=$!
          sleep 1
          ./bin/mk create-topic -t smoke -p 1
          ./bin/mk produce -t smoke -p 0 -m "smoke-message"
          out=$(./bin/mk consume -t smoke -p 0 -o 0)
          echo "$out"
          echo "$out" | grep -q "smoke-message"
          kill $BROKER
